# Publishes vibeprint to npm whenever main has a version that isn't on npm yet.
# Uses npm trusted publishing (OIDC): no token, no 2FA prompt, and npm records provenance.
# Set up once with: npm trust github vibeprint --file publish.yml --repo viraatdas/vibeprint --allow-publish
name: Publish to npm

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Publish if this version is new
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "vibeprint@$version" version >/dev/null 2>&1; then
            echo "vibeprint@$version is already on npm; nothing to do."
            exit 0
          fi
          git config --global user.email "ci@vibeprint.dev"
          git config --global user.name "vibeprint CI"
          npm publish --access public
