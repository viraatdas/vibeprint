# The vibeprint relay: https://live.vibeprint.viraat.dev and https://<session>.live.vibeprint.viraat.dev
# Sessions live in memory, so this runs as exactly one always-on machine (deploy with --ha=false).
app = 'vibeprint-relay'
primary_region = 'sjc'

[build]

[env]
  RELAY_DOMAIN = 'live.vibeprint.viraat.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/_relay/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
